<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Smart dining scenario">
  <defs>
    <linearGradient id="dn-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3E9"/>
    </linearGradient>
    <radialGradient id="dn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD8A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD8A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#dn-panel)"/>
  <rect x="14" y="14" width="772" height="572" rx="20" fill="none" stroke="#F1D9C4" stroke-width="2"/>

  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="#F4E6D8"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#E7D2BD" stroke-width="2"/>

  <!-- pendant light glow -->
  <circle cx="400" cy="300" r="150" fill="url(#dn-glow)"/>
  <line x1="400" y1="90" x2="400" y2="180" stroke="#9AA3AE" stroke-width="4"/>
  <path d="M370 180 h60 l-14 40 h-32 Z" fill="#FFB347"/>
  <circle cx="400" cy="180" r="7" fill="#FE6019"/>

  <!-- dining table -->
  <rect x="250" y="400" width="320" height="80" rx="16" fill="#34404F"/>
  <rect x="270" y="360" width="70" height="44" rx="10" fill="#3D4A5B"/>
  <rect x="460" y="360" width="70" height="44" rx="10" fill="#3D4A5B"/>

  <!-- background music speaker -->
  <rect x="120" y="360" width="40" height="90" rx="14" fill="#FE6019"/>
  <circle cx="140" cy="388" r="7" fill="#FFE6D2"/>

  <!-- environment sensor -->
  <rect x="630" y="300" width="44" height="58" rx="9" fill="#FFB347"/>
  <circle cx="652" cy="324" r="9" fill="#FFFFFF"/>

  <!-- hub node -->
  <g>
    <circle cx="600" cy="180" r="42" fill="none" stroke="#1FA8A0" stroke-width="3" stroke-dasharray="6 7"/>
    <rect x="572" y="152" width="56" height="56" rx="14" fill="#1FA8A0"/>
    <circle cx="600" cy="180" r="13" fill="#FFFFFF"/>
  </g>
  <path d="M600 236 V360 H430 V180" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M600 236 V300 H652" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M140 360 V300 H600" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
</svg>
