<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Smart bathroom scenario">
  <defs>
    <linearGradient id="ba-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3E9"/>
    </linearGradient>
    <radialGradient id="ba-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD8A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD8A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#ba-panel)"/>
  <rect x="14" y="14" width="772" height="572" rx="20" fill="none" stroke="#F1D9C4" stroke-width="2"/>

  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="#F4E6D8"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#E7D2BD" stroke-width="2"/>

  <!-- bathtub -->
  <rect x="120" y="380" width="280" height="90" rx="40" fill="#34404F"/>
  <rect x="140" y="396" width="240" height="58" rx="28" fill="#CFE3EC"/>

  <!-- smart mirror glow -->
  <circle cx="560" cy="280" r="130" fill="url(#ba-glow)"/>
  <rect x="500" y="180" width="120" height="150" rx="14" fill="#2A333F"/>
  <rect x="512" y="192" width="96" height="126" rx="8" fill="#3D4A5B"/>
  <circle cx="560" cy="255" r="10" fill="#FFB347"/>

  <!-- human sensor -->
  <rect x="430" y="320" width="40" height="54" rx="9" fill="#FE6019"/>
  <circle cx="450" cy="342" r="8" fill="#FFE6D2"/>

  <!-- ventilation -->
  <rect x="200" y="150" width="80" height="30" rx="8" fill="#FFB347"/>
  <circle cx="240" cy="165" r="9" fill="#FFFFFF"/>

  <!-- hub node -->
  <g>
    <circle cx="600" cy="430" r="42" fill="none" stroke="#1FA8A0" stroke-width="3" stroke-dasharray="6 7"/>
    <rect x="572" y="402" width="56" height="56" rx="14" fill="#1FA8A0"/>
    <circle cx="600" cy="430" r="13" fill="#FFFFFF"/>
  </g>
  <path d="M560 280 V430 H558" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M450 374 V430 H558" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M240 180 V430 H558" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
</svg>
