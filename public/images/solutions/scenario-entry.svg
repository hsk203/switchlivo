<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Smart entryway scenario">
  <defs>
    <linearGradient id="en-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3E9"/>
    </linearGradient>
    <radialGradient id="en-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD8A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD8A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="en-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34404F"/>
      <stop offset="1" stop-color="#222B36"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#en-panel)"/>
  <rect x="14" y="14" width="772" height="572" rx="20" fill="none" stroke="#F1D9C4" stroke-width="2"/>

  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="#F4E6D8"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#E7D2BD" stroke-width="2"/>

  <!-- welcome glow -->
  <circle cx="250" cy="455" r="150" fill="url(#en-glow)"/>

  <!-- door -->
  <rect x="150" y="150" width="190" height="320" rx="14" fill="url(#en-door)"/>
  <rect x="172" y="172" width="146" height="276" rx="10" fill="#2A333F"/>
  <!-- door handle -->
  <circle cx="312" cy="320" r="9" fill="#C9CED6"/>
  <!-- smart lock -->
  <rect x="196" y="300" width="46" height="58" rx="8" fill="#FE6019"/>
  <circle cx="219" cy="322" r="9" fill="#FFE6D2"/>
  <rect x="210" y="338" width="18" height="5" rx="2.5" fill="#FFE6D2"/>

  <!-- motion sensor on wall -->
  <rect x="430" y="150" width="58" height="34" rx="8" fill="#FE6019"/>
  <circle cx="459" cy="167" r="7" fill="#FFF"/>
  <!-- detection cone -->
  <path d="M459 184 L400 300 L518 300 Z" fill="#FE6019" opacity="0.12"/>

  <!-- wall switch -->
  <rect x="470" y="330" width="44" height="58" rx="8" fill="#FFB347"/>
  <rect x="480" y="342" width="24" height="14" rx="3" fill="#FFFFFF"/>

  <!-- hub node -->
  <g>
    <circle cx="600" cy="430" r="42" fill="none" stroke="#1FA8A0" stroke-width="3" stroke-dasharray="6 7"/>
    <rect x="572" y="402" width="56" height="56" rx="14" fill="#1FA8A0"/>
    <circle cx="600" cy="430" r="13" fill="#FFFFFF"/>
  </g>
  <!-- connect lines -->
  <path d="M219 320 H430 V430 H558" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M492 330 H560 V430" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M459 184 H540 V430 H642" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>

  <!-- ceiling light -->
  <circle cx="400" cy="90" r="10" fill="#FFB347"/>
  <path d="M400 100 L388 150 H412 Z" fill="#FFD8A8" opacity="0.6"/>
</svg>
