<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Smart kitchen scenario">
  <defs>
    <linearGradient id="kt-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3E9"/>
    </linearGradient>
    <radialGradient id="kt-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD8A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD8A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#kt-panel)"/>
  <rect x="14" y="14" width="772" height="572" rx="20" fill="none" stroke="#F1D9C4" stroke-width="2"/>

  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="#F4E6D8"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#E7D2BD" stroke-width="2"/>

  <!-- cabinets -->
  <rect x="90" y="360" width="240" height="110" rx="10" fill="#34404F"/>
  <rect x="100" y="372" width="220" height="86" rx="7" fill="#3D4A5B"/>
  <rect x="200" y="372" width="6" height="86" fill="#2A333F"/>
  <!-- counter -->
  <rect x="90" y="340" width="240" height="22" rx="6" fill="#9AA3AE"/>
  <!-- range hood -->
  <rect x="150" y="250" width="120" height="70" rx="10" fill="#2A333F"/>
  <rect x="190" y="320" width="40" height="20" rx="4" fill="#3D4A5B"/>

  <!-- wall smart panel -->
  <rect x="430" y="300" width="60" height="80" rx="10" fill="#FFB347"/>
  <circle cx="460" cy="332" r="16" fill="#FFFFFF"/>
  <circle cx="460" cy="332" r="7" fill="#FE6019"/>

  <!-- smoke sensor (ceiling) -->
  <circle cx="640" cy="120" r="20" fill="#FFFFFF" stroke="#FE6019" stroke-width="4"/>
  <circle cx="640" cy="120" r="6" fill="#FE6019"/>

  <!-- water sensor near sink -->
  <rect x="380" y="346" width="34" height="22" rx="5" fill="#FE6019"/>
  <path d="M397 352 q10 8 0 16" stroke="#FFE6D2" stroke-width="3" fill="none"/>

  <!-- glow -->
  <circle cx="210" cy="330" r="120" fill="url(#kt-glow)"/>

  <!-- hub node -->
  <g>
    <circle cx="600" cy="430" r="42" fill="none" stroke="#1FA8A0" stroke-width="3" stroke-dasharray="6 7"/>
    <rect x="572" y="402" width="56" height="56" rx="14" fill="#1FA8A0"/>
    <circle cx="600" cy="430" r="13" fill="#FFFFFF"/>
  </g>
  <path d="M460 380 H540 V430 H558" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M640 140 V430 H642" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M397 368 V430 H558" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
</svg>
