<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Smart living room scenario">
  <defs>
    <linearGradient id="lv-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3E9"/>
    </linearGradient>
    <radialGradient id="lv-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD8A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD8A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" rx="28" fill="url(#lv-panel)"/>
  <rect x="14" y="14" width="772" height="572" rx="20" fill="none" stroke="#F1D9C4" stroke-width="2"/>

  <!-- floor -->
  <rect x="0" y="470" width="800" height="130" fill="#F4E6D8"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#E7D2BD" stroke-width="2"/>

  <!-- window with curtain -->
  <rect x="70" y="120" width="150" height="220" rx="8" fill="#EAF3F2"/>
  <line x1="145" y1="120" x2="145" y2="340" stroke="#CFE2DF" stroke-width="3"/>
  <path d="M70 120 q30 110 0 220" fill="#FE6019" opacity="0.18"/>
  <path d="M220 120 q-30 110 0 220" fill="#FE6019" opacity="0.18"/>

  <!-- TV / display -->
  <rect x="330" y="140" width="200" height="120" rx="10" fill="#2A333F"/>
  <rect x="342" y="152" width="176" height="96" rx="6" fill="#3A4656"/>
  <rect x="360" y="170" width="120" height="10" rx="5" fill="#FE6019" opacity="0.8"/>
  <rect x="360" y="190" width="90" height="8" rx="4" fill="#FFB347" opacity="0.8"/>
  <rect x="418" y="260" width="44" height="14" rx="4" fill="#2A333F"/>

  <!-- sofa -->
  <rect x="300" y="400" width="280" height="70" rx="18" fill="#34404F"/>
  <rect x="300" y="360" width="70" height="80" rx="16" fill="#3D4A5B"/>
  <rect x="510" y="360" width="70" height="80" rx="16" fill="#3D4A5B"/>

  <!-- floor lamp glow -->
  <circle cx="640" cy="430" r="120" fill="url(#lv-glow)"/>
  <rect x="632" y="330" width="8" height="140" fill="#9AA3AE"/>
  <path d="M610 330 h60 l-12 -40 h-36 Z" fill="#FFB347"/>
  <circle cx="640" cy="330" r="6" fill="#FE6019"/>

  <!-- smart speaker -->
  <rect x="250" y="380" width="40" height="90" rx="14" fill="#FE6019"/>
  <circle cx="270" cy="405" r="7" fill="#FFE6D2"/>

  <!-- hub node -->
  <g>
    <circle cx="600" cy="180" r="42" fill="none" stroke="#1FA8A0" stroke-width="3" stroke-dasharray="6 7"/>
    <rect x="572" y="152" width="56" height="56" rx="14" fill="#1FA8A0"/>
    <circle cx="600" cy="180" r="13" fill="#FFFFFF"/>
  </g>
  <path d="M600 236 V300 H430 V140" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M600 236 V430 H640" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
  <path d="M270 380 V300 H600" fill="none" stroke="#1FA8A0" stroke-width="2.5" stroke-dasharray="5 6" opacity="0.7"/>
</svg>
