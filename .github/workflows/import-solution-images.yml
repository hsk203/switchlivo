name: Import Solutions Photography

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-solution-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and optimize licensed Pexels and Unsplash photos
        run: |
          python -m pip install --disable-pip-version-check Pillow
          mkdir -p public/images/solutions
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          photos = {
              "hero-living.webp": "https://images.unsplash.com/photo-1751806524609-ce4550a4aae6?auto=format&fit=crop&w=2400&q=88",
              "residential.webp": "https://images.unsplash.com/photo-1751806524609-ce4550a4aae6?auto=format&fit=crop&w=1600&q=86",
              "hotel.webp": "https://images.unsplash.com/photo-1776500587913-6e55907a738e?auto=format&fit=crop&w=1800&q=86",
              "office.webp": "https://images.unsplash.com/photo-1774953037913-af0cf688491a?auto=format&fit=crop&w=1800&q=86",
              "switch-panel.webp": "https://images.unsplash.com/photo-1739083168122-f1f59db99e78?auto=format&fit=crop&w=1400&q=88",
              "hero-main.webp": "https://images.unsplash.com/photo-1772797583328-f83bc3f94f80?auto=format&fit=crop&w=2400&q=88",
              "room-living.webp": "https://images.unsplash.com/photo-1774200981075-a728eaaa3824?auto=format&fit=crop&w=1800&q=86",
              "room-bedroom.webp": "https://images.unsplash.com/photo-1774716926071-fc03e73d0806?auto=format&fit=crop&w=1800&q=86",
              "room-hotel.webp": "https://images.unsplash.com/photo-1760573776062-7d2a7baeb49d?auto=format&fit=crop&w=1800&q=86",
              "room-office.webp": "https://images.unsplash.com/photo-1765371512971-9d4da531d004?auto=format&fit=crop&w=1800&q=86",
              "hero-smart-control.webp": "https://images.pexels.com/photos/16423104/pexels-photo-16423104.jpeg",
              "room-living-hq.webp": "https://images.pexels.com/photos/28456458/pexels-photo-28456458.jpeg",
              "room-bedroom-hq.webp": "https://images.pexels.com/photos/35868592/pexels-photo-35868592.jpeg",
              "room-hotel-hq.webp": "https://images.pexels.com/photos/17948132/pexels-photo-17948132.jpeg",
              "room-office-hq.webp": "https://images.pexels.com/photos/20390771/pexels-photo-20390771.jpeg",
          }

          out = Path("public/images/solutions")
          for filename, url in photos.items():
              request = Request(url, headers={"User-Agent": "SwitchLivo-Solutions-Image-Importer/1.0"})
              with urlopen(request, timeout=60) as response:
                  raw = response.read()
              image = Image.open(BytesIO(raw))
              image = ImageOps.exif_transpose(image).convert("RGB")
              # Room-tab photography is displayed in a wide 1180px panel.
              # Keep a 2x source for high-density screens without shipping oversized originals.
              if filename in {
                  "room-living-hq.webp",
                  "room-bedroom-hq.webp",
                  "room-hotel-hq.webp",
                  "room-office-hq.webp",
              }:
                  image.thumbnail((2200, 1400), Image.Resampling.LANCZOS)
                  quality = 80
              else:
                  image.thumbnail((5000, 4000), Image.Resampling.LANCZOS)
                  quality = 88
              target = out / filename
              image.save(target, "WEBP", quality=quality, method=6)
              print(f"{target}: {image.width}x{image.height}, {target.stat().st_size} bytes")
          PY

      - name: Verify generated assets
        run: |
          test "$(find public/images/solutions -maxdepth 1 -name '*.webp' | wc -l)" -eq 15
          file public/images/solutions/*.webp
          du -h public/images/solutions/*.webp

      - name: Commit optimized photos to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/solutions/*.webp
          git commit -m "Add optimized photography for solutions page"
          git pull --rebase origin main
          git push origin HEAD:main
